<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club</title>
</head>
<body>
    <h1>Professional Nap Club</h1>
    <p>Sign up to become a professional napper</p>

    <form>
        <label for = "name">Name:</label>
        <input type = "text" id = "name" name = "name">
        
        <br>

        <label for = "email"> Email:</label>
        <input type = "email" id = "email" name = "email">

        <br>
        <label for = "password"> Password:</label>
        <input type = "password" id = "password" name = "password">

        <br>
        <p> Favorite nap length:</p>

        <input type = "radio" id = "short" name = "nap" value = "short">
        <label for = "short">Short nap </label>

        <input type = "radio" id = "long" name = "nap" value = "long">
        <label for = "long">Long nap </label>

        <br>

        <input type = "submit">
        
    </form>
</body>
</html>
