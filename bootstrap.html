<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lost Pet</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
    <body>
        <div class="container">
            <h1 class="bg-danger">Lost Fire Breathing Dragon</h1>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
            <img src="missing.webp" alt="missing sign" width="200" height="125">
            <p class="display-1">Last seen: 187 days ago</p>
            <p class="text-end">Location: 123 Main Street, Oakland</p>
            <p class="text-bg-primary p-3">If seen: Do not approach, please call owner immediately</p>
            <div class="border border-success p-2 mb-2">If seen: Keep a distance from the dragon</div>
       <!-- my 2 active buttons -->
            <p>These are 2 active buttons:</p>
            <a class="btn btn-primary" href="webring.html" role="button">Click to go to my webring!</a>
            <br>
            <br>
            <a class="btn btn-primary" href="club.html" role="button">Click to go to my fake club page!</a>
        <!-- my disabled button -->
            <br>
            <br>
            <button type="button" class="btn btn-primary" disabled>This is a disabled button</button>
        <div class="mb-3">
            <label for="formGroupInput" class="form-label">Enter Name</label>
            <input type="text" class="form-control" id="formGroupInput" placeholder="Name">
        </div>
        <div class="mb-3">
            <label for="formGroupInput2" class="form-label">Do you have information about the lost dragon?</label>
            <input type="text" class="form-control" id="formGroupInput2" placeholder="Type here">
        </div>
        </div> 


        <!-- carousel with images of lost dragon -->
        <div id="carousel" class="carousel slide">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="dragon.png" class="d-block w-100" alt="dragon1">
                </div>
                <div class="carousel-item">
                    <img src="dragon2.webp" class="d-block w-100" alt="dragon2">
                </div>
            </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
        </div>
    </body>
</html>
